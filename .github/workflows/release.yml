# Builda o app autocontido nos runners do GitHub e publica numa Release.
#
#   - Push de uma tag `vX.Y.Z`  -> builda os 2 SOs e cria a Release com os arquivos.
#   - "Run workflow" (manual)    -> so builda (sem publicar), pra testar.
#
# Artefatos: Windows `ANTA-Setup.exe` (Inno) e Linux `ANTA-x86_64.AppImage`.
# O usuario final NAO precisa de Python/Node — mas ainda precisa do **Ollama** + baixar
# um modelo no 1o uso (o Configurador detecta/oferece instalar; ver anta/gui/downloads.py).
#
# NOTA: empacotar apps com deps nativas (pywebview, onnxruntime, ctranslate2) costuma
# pedir 1-2 rodadas de ajuste por SO. Pontos provaveis de mexer:
#   - Linux: backend do pywebview. Aqui usamos o Qt (pywebview[qt]) por ser o mais
#     empacotavel; se preferir GTK, troque pelos pacotes gir/webkit e ajuste o anta.spec.
#   - Windows: o pywebview usa o WebView2 (nativo) via pythonnet.
# Se algo faltar no bundle, adicione em `hiddenimports` no packaging/anta.spec.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # nao derruba a Release do Windows se o AppImage precisar de ajuste
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Libs de sistema (audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsndfile1 libegl1 libxcb-cursor0
      - name: Deps Python (+ backend Qt do pywebview)
        run: pip install -r requirements.txt pyinstaller "pywebview[qt]"
      - name: appimagetool
        run: |
          sudo curl -L -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build (front + PyInstaller + AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # appimagetool sem FUSE no runner
        run: ./packaging/build.sh --appimage
      - uses: actions/upload-artifact@v4
        with:
          name: anta-linux
          path: dist/ANTA-x86_64.AppImage
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deps Python (+ pythonnet p/ o WebView2)
        run: pip install -r requirements.txt pyinstaller pythonnet
      - name: Inno Setup
        run: choco install innosetup -y
      - name: Build (front + PyInstaller + Inno)
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;C:\Program Files (x86)\Inno Setup 6"
          .\packaging\build.ps1 -Inno
      - uses: actions/upload-artifact@v4
        with:
          name: anta-windows
          path: dist/ANTA-Setup.exe
          if-no-files-found: warn

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a Release + anexar os arquivos
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publica a Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
