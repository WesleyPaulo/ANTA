# Gerado pelo instalador. Copie para config.toml (ou o instalador cria).
mode = "leve"                 # leve | pesado | ultra
mic_device = ""               # NOME do microfone (vazio = default do sistema)
hotkey = "ctrl+alt+space"     # usado onde a automacao de atalho e possivel
obsidian_vault = ""           # caminho do vault para salvar notas/documentos
tts = false                   # true = responder tambem por voz (Piper)
tts_voice = ""                # caminho do .onnx da voz (vazio = voz PT-BR padrao)
tts_output = ""               # NOME do device de saida de audio (vazio = padrao)
rag = true                    # false = desliga busca/memoria em notas (RAG na CPU)
web = false                   # OPT-IN: true = busca na web (ROMPE o offline!) default off
web_engine = "duckduckgo"     # duckduckgo (sem chave) | searxng
web_searxng_url = ""          # URL da instancia SearXNG (se web_engine = "searxng")
