[project]
name = "anta"
version = "0.4.0"
description = "Assistente de voz local, push-to-talk, com memoria e busca (RAG) nas notas e instalador cross-platform que recomenda modos por VRAM."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
anta = "anta.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Lista EXPLICITA (nao `packages.find`) de proposito: a descoberta automatica com
# include = ["anta*"] casa por padrao case-SENSITIVE. Num checkout Windows onde a pasta
# saiu como "ANTA" (git com core.ignorecase), ela nao casava nada e o build gerava um
# editable install com MAPPING VAZIO — instalacao "bem-sucedida" e `import anta` quebrado.
# Com a lista explicita, um pacote ausente/renomeado vira ERRO de build, alto e claro.
[tool.setuptools]
packages = [
    "anta",
    "anta.actions",
    "anta.actions.handlers",
    "anta.core",
    "anta.gui",
    "anta.installer",
    "anta.platform",
]
