[project]
name = "anta"
version = "0.2.0"
description = "Assistente de voz local, push-to-talk, com instalador cross-platform que recomenda modos por VRAM."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
anta = "anta.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anta*"]
