# modes.yaml — o coração do projeto.
# Estrutura: `tiers` (compartilhados) × `families` (open-source). O usuário escolhe uma
# FAMÍLIA e depois um MODO (tier). Adicionar família = um bloco em `families`; adicionar
# tier = um bloco em `tiers`. Nenhum código muda.
#
# tiers      = gate (vram_gb) + STT + descrição do PERFIL de uso (igual em toda família).
#   vram_gb  = GATE: card mínimo recomendado (o instalador libera/bloqueia por ele).
# families   = cada família só troca o modelo por tier + o modo de saída estruturada.
#   structured = "tools" (function-calling) | "json". Famílias SEM tool-calling nativo
#                (Gemma, DeepSeek) precisam de "json"; Qwen3/Llama usam "tools".
#   vram_real  = consumo ESTIMADO do LLM já carregado (Ollama Q4_K_M). STT/embedder são
#                CPU e NÃO contam (Princípio 1). Meça com `ollama ps` / `nvidia-smi`.
# Uma família pode OMITIR um tier (ex.: DeepSeek não tem 'batata': nada cabe em 1GB).

tiers:
  batata:
    label: "Batata"
    vram_gb: 1
    stt: "base"
    description: "Roda em quase qualquer GPU (1GB). Modelo minusculo: o roteamento erra mais."
  ultra-leve:
    label: "Ultra Leve"
    vram_gb: 2
    stt: "small"
    description: "Bem leve (2GB). Comandos simples."
  leve:
    label: "Leve"
    vram_gb: 4
    stt: "turbo"             # faster-whisper large-v3-turbo (int8, CPU) — rapido
    description: "Comandos rapidos e notas curtas. STT rapido."
  normal:
    label: "Normal"
    vram_gb: 6
    stt: "large-v3"
    description: "Uso geral com STT large-v3 (PT-BR mais preciso)."
  pesado:
    label: "Pesado"
    vram_gb: 8
    stt: "large-v3"
    description: "Geracao de documentos e transcricao precisa em PT-BR."
  muito-pesado:
    label: "Muito Pesado"
    vram_gb: 10
    stt: "large-v3"
    description: "Modelo grande com folga de VRAM p/ contexto maior (OLLAMA_CONTEXT_LENGTH)."
  ultra:
    label: "Ultra Esforco"
    vram_gb: 12
    stt: "large-v3"
    description: "Maxima qualidade. Requer GPU de 12GB+."

families:
  qwen3:
    label: "Qwen3"
    structured: "tools"       # bom tool-calling
    models:
      batata:       {llm: "qwen3:0.6b", vram_real: "~0.7-1 GB"}
      ultra-leve:   {llm: "qwen3:1.7b", vram_real: "~1.5-1.8 GB"}
      # '4b-instruct', NAO '4b': o tag 'qwen3:4b' foi repontado pro Thinking-2507,
      # cujo template abre <think> INCONDICIONALMENTE — nao ha parametro que desligue
      # (reasoning_effort:"none" e aceito e vira no-op). O raciocinio derrubava o
      # tool-calling: o modelo escrevia buscar_web(...) como texto e o instructor
      # falhava com 'No tool calls found (mode: TOOLS)'. O 4b-instruct nao tem <think>
      # e mantem o bloco de tools intacto. Nao volte pro '4b' sem reler isto.
      leve:         {llm: "qwen3:4b-instruct", vram_real: "~3.3-3.6 GB"}
      normal:       {llm: "qwen3:4b-instruct", vram_real: "~3.3-3.6 GB"}
      pesado:       {llm: "qwen3:8b",   vram_real: "~6-6.5 GB"}
      muito-pesado: {llm: "qwen3:8b",   vram_real: "~6-6.5 GB"}
      ultra:        {llm: "qwen3:14b",  vram_real: "~10-11 GB"}

  gemma:
    label: "Gemma"
    structured: "json"        # Gemma nao tem tool-calling nativo -> JSON
    models:
      batata:       {llm: "gemma3:1b",  vram_real: "~1-1.3 GB"}
      ultra-leve:   {llm: "gemma2:2b",  vram_real: "~1.9-2.2 GB"}
      leve:         {llm: "gemma3:4b",  vram_real: "~4-4.3 GB"}
      normal:       {llm: "gemma3:4b",  vram_real: "~4-4.3 GB"}
      pesado:       {llm: "gemma2:9b",  vram_real: "~6-6.5 GB"}
      muito-pesado: {llm: "gemma3:12b", vram_real: "~9-9.5 GB"}
      ultra:        {llm: "gemma3:12b", vram_real: "~9-9.5 GB"}

  deepseek:
    label: "DeepSeek-R1 (raciocinio)"
    structured: "json"        # R1 pensa antes de responder -> mais lento; JSON p/ estrutura
    models:                   # sem 'batata': o menor (1.5b, ~1.5GB) nao cabe em 1GB
      ultra-leve:   {llm: "deepseek-r1:1.5b", vram_real: "~1.4-1.6 GB"}
      leve:         {llm: "deepseek-r1:1.5b", vram_real: "~1.4-1.6 GB"}
      normal:       {llm: "deepseek-r1:7b",   vram_real: "~5-5.5 GB"}
      pesado:       {llm: "deepseek-r1:8b",   vram_real: "~5.5-6 GB"}
      muito-pesado: {llm: "deepseek-r1:14b",  vram_real: "~9.5-10 GB"}
      ultra:        {llm: "deepseek-r1:14b",  vram_real: "~9.5-10 GB"}
